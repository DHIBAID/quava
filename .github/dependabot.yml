version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/daemon/quavad"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "go", "daemon"]

  - package-ecosystem: "gomod"
    directory: "/daemon/cli"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "go", "daemon"]

  - package-ecosystem: "gomod"
    directory: "/daemon/libquava"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "go", "daemon"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "android"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
