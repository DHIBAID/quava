name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Quava is this about?
      options:
        - daemon (quavad / quava CLI)
        - linux-gui (desktop app)
        - android
        - releases / packaging
        - not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        `journalctl --user -u quavad.service -f -n 50` for the daemon,
        `adb logcat` for Android, or anything shown in a toast/terminal.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Quava version/tag, or commit hash if built from source.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/distro version, Android version/device, desktop environment, etc.
    validations:
      required: false
