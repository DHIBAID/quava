# nfpm config for the Quava desktop app (.deb / .rpm).
# ${VERSION} / ${ARCH} are substituted by `envsubst` in CI before this file is
# handed to nfpm (see .github/workflows/release.yml) — nfpm itself does not
# expand env vars. `nfpm package` is invoked with linux/ as the working
# directory, so `contents[].src` below are relative to linux/, not this file.
name: "quava"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "DHIBAID"
description: |
  Desktop companion app for Quava.
homepage: "https://github.com/DHIBAID/quava"
license: "MIT"

depends:
  - libgtk-4-1
  - libjson-glib-1.0-0

overrides:
  rpm:
    depends:
      - gtk4
      - json-glib

contents:
  - src: build/quava
    dst: /usr/bin/quava-gui
    file_info:
      mode: 0755
  - src: res/icon.png
    dst: /usr/share/icons/hicolor/192x192/apps/io.quava.Desktop.png
  - src: res/io.quava.Desktop.desktop
    dst: /usr/share/applications/io.quava.Desktop.desktop
