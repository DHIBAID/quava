name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  # Strip the leading "v" from a tag like v1.2.3 -> 1.2.3
  VERSION: ${{ github.ref_name }}

jobs:
  daemon-cli:
    name: Daemon + CLI (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.work
          cache-dependency-path: |
            daemon/quavad/go.sum
            daemon/cli/go.sum
            daemon/libquava/go.sum

      - name: Build binaries
        working-directory: daemon
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/quavad ./quavad
          go build -trimpath -ldflags "-s -w" -o dist/quava ./cli

      - name: Package tarball
        working-directory: daemon
        run: |
          VERSION="${VERSION#v}"
          PKG="quava-daemon_${VERSION}_linux_${{ matrix.arch }}"
          mkdir -p "$PKG/systemd"
          cp dist/quavad dist/quava "$PKG/"
          cp systemd/quavad.service systemd/quavad.socket "$PKG/systemd/"
          cp ../LICENSE ../readme.md "$PKG/"
          tar czf "${PKG}.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: quava-daemon-${{ matrix.arch }}
          path: daemon/quava-daemon_*.tar.gz

  linux-desktop:
    name: Linux desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # No go.sum of ours is relevant here (this only `go install`s nfpm).
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libjson-glib-dev libglib2.0-dev libglib2.0-bin gettext-base

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build
        working-directory: linux
        run: make build

      - name: Package .deb and .rpm
        working-directory: linux
        env:
          ARCH: amd64
        run: |
          export VERSION="${VERSION#v}"
          mkdir -p dist
          envsubst '${VERSION} ${ARCH}' < packaging/nfpm.yaml > packaging/nfpm.rendered.yaml
          nfpm package --config packaging/nfpm.rendered.yaml --packager deb --target "dist/quava-desktop_${VERSION}_amd64.deb"
          nfpm package --config packaging/nfpm.rendered.yaml --packager rpm --target "dist/quava-desktop_${VERSION}.x86_64.rpm"

      - name: Install linuxdeploy + GTK plugin
        working-directory: linux
        run: |
          curl -sSfLo linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfLo linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-gtk.sh
          # GitHub-hosted runners don't reliably support FUSE, so extract and
          # run linuxdeploy directly instead of executing the AppImage itself.
          ./linuxdeploy.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-squashfs

      - name: Build AppImage
        working-directory: linux
        env:
          DEPLOY_GTK_VERSION: "4"
        run: |
          VERSION="${VERSION#v}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/192x192/apps
          cp build/quava AppDir/usr/bin/quava-gui
          cp res/io.quava.Desktop.desktop AppDir/usr/share/applications/
          cp res/icon.png AppDir/usr/share/icons/hicolor/192x192/apps/io.quava.Desktop.png
          PATH="$PWD:$PATH" ./linuxdeploy-squashfs/AppRun \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.quava.Desktop.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/192x192/apps/io.quava.Desktop.png \
            --plugin gtk \
            --output appimage
          mv Quava*.AppImage "dist/quava-desktop_${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: quava-desktop
          path: |
            linux/dist/*.deb
            linux/dist/*.rpm
            linux/dist/*.AppImage

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          # Override the action's default ("tools platform-tools") — the
          # legacy "tools" package no longer exists in the SDK repo. AGP
          # auto-downloads the platform/build-tools it needs during the
          # Gradle build below, now that licenses are accepted.
          packages: platform-tools

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.QUAVA_RELEASE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          QUAVA_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          QUAVA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.QUAVA_RELEASE_KEYSTORE_PASSWORD }}
          QUAVA_RELEASE_KEY_ALIAS: ${{ secrets.QUAVA_RELEASE_KEY_ALIAS }}
          QUAVA_RELEASE_KEY_PASSWORD: ${{ secrets.QUAVA_RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${VERSION#v}"
          ./gradlew assembleRelease \
            -PquavaVersionName="$VERSION_NAME" \
            -PquavaVersionCode="${{ github.run_number }}"

      - name: Rename APK
        run: |
          VERSION="${VERSION#v}"
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release.apk "android/dist/quava_${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: quava-android
          path: android/dist/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    name: Publish GitHub Release
    needs: [daemon-cli, linux-desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: dist/**
